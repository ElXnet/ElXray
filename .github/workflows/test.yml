name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-assets
        with:
          windows: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: test-assets
          path: resources/


  check-format-and-proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check local stage-3 shell scripts
        run: bash -n scripts/check-stage3-local.sh scripts/prepare-stage3-test-assets.sh
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode dryrun -pwd ./
      - name: Check Protobuf
        run: go run ./infra/vprotogen/main.go -mode check -pwd ./

  test:
    needs: check-assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Download verified assets
        uses: actions/download-artifact@v8
        with:
          name: test-assets
          path: resources

      - name: Test
        run: go test -timeout 1h -v ./...
      - name: Stress TUN loss/retransmission timing on Windows
        if: runner.os == 'Windows'
        run: go test ./proxy/tun -run '^TestTCPLossAgain$' -count=20 -timeout 3m
