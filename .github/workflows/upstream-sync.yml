name: Sync Xray upstream release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/upstream-sync.yml'
      - '.github/scripts/sync_upstream.py'
      - '.github/scripts/test_sync_upstream.py'

permissions:
  contents: read

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test update preparation without GitHub credentials
        run: python3 -m unittest discover -s .github/scripts -p test_sync_upstream.py -v

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify GitHub App credentials
        env:
          CLIENT_ID: ${{ vars.ELX_SYNC_APP_ID }}
          PRIVATE_KEY: ${{ secrets.ELX_SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo '::error::Configure ELX_SYNC_APP_ID (variable) and ELX_SYNC_APP_PRIVATE_KEY (secret) for this repository in organization Actions settings.'
            exit 1
          fi
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ELX_SYNC_APP_ID }}
          private-key: ${{ secrets.ELX_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ElXray
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Go for Protobuf regeneration
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Prepare upstream release pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/sync_upstream.py
